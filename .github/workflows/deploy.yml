name: Deploy Main Store

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (CI check)
        run: npm ci

      - name: Generate Prisma client (CI check)
        run: npx prisma generate

      - name: Run Jest test suite
        run: npm test --passWithNoTests

      - name: Run repository integration tests
        run: npm run test:repositories --if-present

  deploy:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (CI check)
        run: npm ci

      - name: Generate Prisma client (CI check)
        run: npx prisma generate

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/eonlinebazar
            git pull origin main
            cd backend
            npm install --only=production
            cd ..
            npx prisma generate
            pm2 reload eonlinebazar-store --update-env || pm2 restart all
            pm2 status
