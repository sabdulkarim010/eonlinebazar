<!-- ============================================================
     ✉️ CUSTOMER MESSAGES / INQUIRIES — OUTLOOK SPLIT INBOX
     ============================================================ -->
<section id="view-messages" class="admin-section support-inbox-section" style="display: none;">
    <div class="section-header-box support-inbox-header">
        <div>
            <h3>Messages / Inquiries</h3>
            <p class="section-subtitle">Outlook-style split inbox — browse messages and reply in one full-width view.</p>
        </div>
        <button type="button" id="messagesRefreshBtn" class="btn-secondary support-inbox-refresh-btn">
            <i class="fa-solid fa-rotate"></i> Refresh
        </button>
    </div>

    <div class="outlook-inbox-shell support-inbox-split grid grid-cols-12 gap-4 h-[calc(100vh-140px)] border rounded-2xl overflow-hidden bg-white dark:bg-slate-900 shadow-sm">
        <aside class="support-inbox-master outlook-inbox-list-pane col-span-4 flex flex-col min-h-0 border-r border-slate-200 dark:border-slate-700" aria-label="Inquiry list">
            <div class="support-inbox-master-header">
                <div class="support-inbox-search-wrap">
                    <i class="fa-solid fa-magnifying-glass support-inbox-search-icon" aria-hidden="true"></i>
                    <input
                        type="search"
                        id="messagesSearchInput"
                        class="support-inbox-search"
                        placeholder="Search mail…"
                        autocomplete="off"
                        aria-label="Search inquiries"
                    >
                </div>
                <div class="support-inbox-tabs" role="tablist" aria-label="Filter inquiries by status">
                    <button type="button" class="support-inbox-tab is-active" data-filter="all" role="tab" aria-selected="true">
                        All <span class="support-inbox-tab-count" id="supportTabCountAll">0</span>
                    </button>
                    <button type="button" class="support-inbox-tab" data-filter="unread" role="tab" aria-selected="false">
                        Unread <span class="support-inbox-tab-count support-inbox-tab-count--unread" id="supportTabCountUnread">0</span>
                    </button>
                    <button type="button" class="support-inbox-tab" data-filter="replied" role="tab" aria-selected="false">
                        Replied <span class="support-inbox-tab-count support-inbox-tab-count--replied" id="supportTabCountReplied">0</span>
                    </button>
                </div>
            </div>
            <div class="messages-bulk-toolbar" id="messages-bulk-toolbar">
                <span id="messages-selected-count">0 selected</span>
                <button type="button" class="danger-btn-sm" onclick="bulkDeleteMessages()">
                    <i class="fa-solid fa-trash-can"></i> Delete Selected
                </button>
            </div>
            <div id="messagesInboxList" class="support-inbox-list" role="listbox" aria-label="Inquiries">
                <div class="support-inbox-list-loading text-center"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
            </div>
            <div class="apg-wrapper support-inbox-pg">
                <div class="apg-left">
                    Show
                    <select class="apg-limit-select" id="message-pg-limit"
                            onchange="messagePg.changeLimit(this.value)">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                    entries &nbsp;|&nbsp;
                    <span class="apg-info" id="message-pg-info"></span>
                </div>
                <div class="apg-center" id="message-pg-btns"></div>
                <div class="apg-right">
                    Go to:
                    <input type="number" class="apg-jump-input" id="message-pg-jump" min="1"
                           onkeydown="if(event.key==='Enter') messagePg.goTo(+this.value)">
                    <button type="button" class="apg-btn"
                            onclick="messagePg.goTo(+document.getElementById('message-pg-jump').value)">
                        Go
                    </button>
                    <span class="apg-info">Total: <strong id="message-total-count">0</strong></span>
                </div>
            </div>
        </aside>

        <div class="support-inbox-detail outlook-inbox-reading-pane col-span-8 flex flex-col min-h-0">
            <div id="inquiryDetailEmpty" class="support-inbox-detail-empty">
                <div class="support-inbox-detail-empty-icon" aria-hidden="true">
                    <i class="fa-regular fa-envelope-open"></i>
                </div>
                <h4>Select an inquiry to read</h4>
                <p>Choose a message from the list to view the full conversation and reply.</p>
            </div>

            <div id="inquiryDetailPane" class="support-inbox-detail-pane" style="display: none;">
                <div class="outlook-reading-topbar">
                    <div class="outlook-reading-topbar-main">
                        <h2 id="inquiryDetailSubjectLine" class="outlook-reading-subject">—</h2>
                        <span id="inquiryDetailStatusBadge" class="outlook-reading-status"></span>
                    </div>
                    <div class="support-inbox-detail-actions outlook-reading-actions">
                        <button type="button" class="outlook-action-btn" id="inquiryDetailMarkReadBtn" title="Mark as read">
                            <i class="fa-solid fa-envelope-open"></i>
                            <span>Mark Read</span>
                        </button>
                        <button type="button" class="outlook-action-btn outlook-action-btn--danger" id="inquiryDetailDeleteBtn" title="Delete inquiry">
                            <i class="fa-solid fa-trash"></i>
                            <span>Delete</span>
                        </button>
                    </div>
                </div>

                <div class="support-inbox-detail-scroll outlook-reading-body">
                    <div class="outlook-sender-card">
                        <span id="inquiryDetailSenderAvatar" class="outlook-sender-avatar">?</span>
                        <div class="outlook-sender-info">
                            <strong id="inquiryDetailSenderName" class="outlook-sender-name">—</strong>
                            <div class="outlook-sender-meta">
                                <span class="outlook-sender-field">
                                    <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                                    <a id="inquiryDetailEmail" href="#" class="outlook-sender-link">—</a>
                                    <button type="button" class="outlook-copy-btn" id="inquiryDetailCopyEmail" data-copy="" title="Copy email" aria-label="Copy email">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </span>
                                <span class="outlook-sender-field">
                                    <i class="fa-solid fa-phone" aria-hidden="true"></i>
                                    <a id="inquiryDetailPhone" href="#" class="outlook-sender-link">—</a>
                                    <button type="button" class="outlook-copy-btn" id="inquiryDetailCopyPhone" data-copy="" title="Copy phone" aria-label="Copy phone">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </span>
                                <span class="outlook-sender-field outlook-sender-timestamp">
                                    <i class="fa-regular fa-clock" aria-hidden="true"></i>
                                    <time id="inquiryDetailDate">—</time>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="outlook-email-body bg-slate-50 dark:bg-slate-800/50 p-5 rounded-xl border border-slate-200 dark:border-slate-700">
                        <div id="inquiryDetailMessage" class="outlook-email-body-text">—</div>
                    </div>

                    <div id="inquiryDetailSentReply" class="outlook-sent-reply" style="display: none;">
                        <span class="outlook-sent-reply-label">Your Reply</span>
                        <div id="inquiryDetailSentReplyText" class="outlook-sent-reply-text"></div>
                        <small id="inquiryDetailSentReplyAt" class="outlook-sent-reply-at"></small>
                    </div>
                </div>

                <div class="support-inbox-detail-reply outlook-reply-editor">
                    <label for="inquiryDetailReplyText" class="outlook-reply-label">Reply via Email</label>
                    <textarea
                        id="inquiryDetailReplyText"
                        class="support-inbox-detail-reply-textarea outlook-reply-textarea"
                        rows="5"
                        maxlength="10000"
                        placeholder="Write your reply to the customer…"
                    ></textarea>
                    <div class="support-inbox-detail-reply-footer outlook-reply-footer">
                        <span class="support-inbox-detail-char-count"><span id="inquiryDetailCharCount">0</span> / 10,000</span>
                        <button type="button" class="btn-primary support-inbox-detail-send-btn" id="inquiryDetailSendBtn">
                            <i class="fa-solid fa-paper-plane"></i> Send Email Reply
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
