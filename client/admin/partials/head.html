<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Super Admin Panel | EonlineBazar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/cms-page.css">
    <script src="/js/admin-pagination.js"></script>

    <style>
    :root {
      /* Default: Dark Mode (Night) — premium GitHub/VS Code navy */
      --bg-primary: #0d1117;
      --bg-secondary: #161b27;
      --bg-card: #1a2035;
      --border-color: #2d3748;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --sidebar-bg: #111318;
      --header-bg: #161b27;
      --input-bg: #0d1117;

      /* Bridge existing admin.css tokens to dark theme */
      --bg-color: var(--bg-primary);
      --card-bg: var(--bg-card);
      --text-main: var(--text-primary);
      --secondary-color: var(--text-primary);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --sidebar-bg: #1e293b; /* sidebar stays dark in light mode */
      --header-bg: #ffffff;
      --input-bg: #f8fafc;

      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #334155;
      --secondary-color: #1e293b;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    .main-content {
      background: var(--bg-primary);
    }

    .top-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .metric-card,
    .card,
    .panel {
      background: var(--bg-card);
      border-color: var(--border-color);
      color: var(--text-primary);
    }

    .page-title-block h1 {
      color: var(--text-primary);
    }

    .page-title-block p,
    .date-display,
    .live-clock {
      color: var(--text-secondary);
    }

    .header-search input,
    .main-content input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]):not([type="range"]),
    .main-content select,
    .main-content textarea {
      background: var(--input-bg);
      border-color: var(--border-color);
      color: var(--text-primary);
    }

    .header-search input:focus {
      background-color: var(--input-bg);
    }

    /* Sidebar always uses dark token (never flips with light content) */
    .sidebar {
      background-color: var(--sidebar-bg);
    }

    #themeModeBtn {
      flex-shrink: 0;
    }

    [data-theme="light"] #themeModeBtn {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #1e293b;
    }
    </style>

    <script>
    if (!localStorage.getItem('adminToken')) {
        window.location.replace("/admin-login");
    }
    // Restore admin theme before paint to avoid flash
    (function() {
      const saved = localStorage.getItem('adminTheme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
    // Admin panel should never rely on stale service worker cache
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
            registrations.forEach(reg => reg.update());
        });
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { csp: { nonce: '' } }</script>
</head>
