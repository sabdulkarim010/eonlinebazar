<section id="view-customers" class="admin-section" style="display: none;">
                <div class="table-container customers-table-container">
                    <div class="table-header customers-table-header">
                        <h3 id="table-title">All Registered Customers</h3>
                        <div class="customers-toolbar" role="toolbar" aria-label="Customer table filters">
                            <div class="customers-toolbar__search">
                                <div class="customers-search-box">
                                    <span class="customers-search-box__icon" aria-hidden="true">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input type="search" id="customerSearchInput" class="customers-search-box__input" placeholder="Search by name, email, phone, or ID..." autocomplete="off" aria-label="Search customers">
                                </div>
                            </div>
                            <div class="customers-toolbar__actions">
                                <select id="customerTierFilter" class="customers-tier-filter" aria-label="Filter by loyalty tier">
                                    <option value="">All tiers</option>
                                    <option value="silver">Silver</option>
                                    <option value="gold">Gold</option>
                                    <option value="platinum">Platinum</option>
                                    <option value="none">None</option>
                                </select>
                                <select id="customerRfmFilter" class="customers-tier-filter" aria-label="Filter by RFM segment">
                                    <option value="">All RFM segments</option>
                                    <option value="CHAMPION">Champion</option>
                                    <option value="LOYAL">Loyal</option>
                                    <option value="AT_RISK">At Risk</option>
                                    <option value="LOST">Lost</option>
                                    <option value="NEW">New</option>
                                    <option value="STANDARD">Standard</option>
                                </select>
                                <button type="button" class="customers-export-btn" id="recalculateRfmBtn" data-permission="manage_customers" onclick="recalculateRfmSegments()" title="Recalculate RFM tags from order history">
                                    <i class="fa-solid fa-chart-pie"></i> Recalculate RFM
                                </button>
                                <div class="customer-segment-tabs" id="customerSegmentTabs">
                                    <button type="button" class="segment-tab active" data-segment="all">All Customers</button>
                                    <button type="button" class="segment-tab" data-segment="vip">👑 VIP / Top Buyers</button>
                                    <button type="button" class="segment-tab" data-segment="frequent">Frequent Buyers</button>
                                    <button type="button" class="segment-tab" data-segment="inactive">Inactive / No Orders</button>
                                </div>
                                <button type="button" class="customers-export-btn" id="customersExportCsvBtn" data-permission="manage_customers" onclick="exportCustomersCsvReport()" title="Export customers as CSV">
                                    <i class="fa-solid fa-file-csv"></i> Export CSV
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="customers-table-scroll">
                        <table class="data-table customers-table">
                            <thead class="customers-table-head">
                                <tr>
                                    <th class="customers-th customers-th--check no-print">
                                        <input type="checkbox" id="customers-select-all" onchange="toggleSelectAllCustomers(this)" aria-label="Select all customers on this page">
                                    </th>
                                    <th class="customers-th">User ID</th>
                                    <th class="customers-th">Full Name</th>
                                    <th class="customers-th">Email Address</th>
                                    <th class="customers-th">Mobile Contact</th>
                                    <th class="customers-th customers-th--num">Orders</th>
                                    <th class="customers-th customers-th--num">Total Spent</th>
                                    <th class="customers-th">Tier</th>
                                    <th class="customers-th">Segment</th>
                                    <th class="customers-th">Account Status</th>
                                    <th class="customers-th customers-th--actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="customerTableBody" class="customers-table-body">
                                <tr><td colspan="11" class="loading-container"><div class="spinner"></div><p>Loading customers...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="customers-bulk-toolbar" id="customers-bulk-toolbar" style="display:none">
                        <span id="customers-selected-count">0 selected</span>
                    </div>
                    <div id="customerPaginationContainer" class="no-print"></div>
                </div>
            </section>
