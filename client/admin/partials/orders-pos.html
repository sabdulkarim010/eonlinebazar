<!-- POS Invoice / Receipt (shown after checkout) -->
<div id="posInvoiceModal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-box pos-invoice-modal-box">
        <div class="modal-header no-print">
            <div>
                <h3><i class="fa-solid fa-receipt"></i> Order Receipt</h3>
                <p class="edit-modal-subtitle">Print or download the POS invoice</p>
            </div>
            <button type="button" class="close-icon-btn" onclick="closePosInvoiceModal()" aria-label="Close invoice">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="modal-body pos-invoice-body">
            <div id="posInvoicePrintable" class="pos-invoice-printable">
                <!-- Filled by renderPosInvoice() -->
            </div>
        </div>

        <div class="modal-footer no-print">
            <button type="button" class="btn-secondary" onclick="closePosInvoiceModal()">Close</button>
            <button type="button" class="pl-export-btn" id="posInvoiceDownloadBtn" onclick="downloadPOSInvoice()">
                <i class="fa-solid fa-file-pdf"></i> Download PDF
            </button>
            <button type="button" class="btn-primary" onclick="printPOSInvoice()">
                <i class="fa-solid fa-print"></i> Print
            </button>
        </div>
    </div>
</div>
