<!-- Customer View Modal -->
<div id="customerViewModal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-box customer-modal-box">
        <div class="modal-header">
            <div class="customer-profile-title">
                <button type="button" id="cvAvatar" class="customer-profile-avatar" aria-label="View or update customer photo" title="View or update photo" onclick="openCustomerAvatarLightbox()">
                    <span class="customer-profile-avatar-initial">?</span>
                    <span class="customer-profile-avatar-overlay" aria-hidden="true"><i class="fa-solid fa-expand"></i></span>
                </button>
                <h3>Customer Profile</h3>
            </div>
            <button type="button" class="close-icon-btn" onclick="closeCustomerViewModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body customer-view-body">
            <div class="customer-view-grid">
                <div class="cv-item"><span class="cv-label">Full Name</span><strong id="cvName">—</strong></div>
                <div class="cv-item"><span class="cv-label">Email</span><strong id="cvEmail">—</strong></div>
                <div class="cv-item"><span class="cv-label">Mobile</span><strong id="cvMobile">—</strong></div>
                <div class="cv-item"><span class="cv-label">Phone</span><strong id="cvPhone">—</strong></div>
                <div class="cv-item"><span class="cv-label">Verification</span><strong id="cvVerified">—</strong></div>
                <div class="cv-item"><span class="cv-label">Account Status</span><strong id="cvAccountStatus">—</strong></div>
                <div class="cv-item"><span class="cv-label">Wallet Balance</span><strong id="cvWallet">—</strong></div>
                <div class="cv-item"><span class="cv-label">Loyalty Points</span><strong id="cvPoints">—</strong></div>
                <div class="cv-item"><span class="cv-label">Total Orders</span><strong id="cvOrderCount">—</strong></div>
                <div class="cv-item cv-full"><span class="cv-label">Address</span><strong id="cvAddress">—</strong></div>
                <div class="cv-item cv-full"><span class="cv-label">Member Since</span><strong id="cvJoined">—</strong></div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeCustomerViewModal()">Close</button>
            <button type="button" class="btn-primary" id="cvEditFromViewBtn"><i class="fa-solid fa-pen"></i> Edit Profile</button>
        </div>
    </div>
</div>

<!-- Customer Avatar Lightbox -->
<div id="customerAvatarLightbox" class="customer-avatar-lightbox" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="cvAvatarLightboxTitle">
    <div class="customer-avatar-lightbox-backdrop" onclick="closeCustomerAvatarLightbox()"></div>
    <div class="customer-avatar-lightbox-panel">
        <button type="button" class="customer-avatar-lightbox-close" onclick="closeCustomerAvatarLightbox()" aria-label="Close photo preview">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="customer-avatar-lightbox-preview" id="cvAvatarLightboxPreview"></div>
        <h4 id="cvAvatarLightboxTitle">Profile Photo</h4>
        <p class="customer-avatar-lightbox-name" id="cvAvatarLightboxName"></p>
        <div class="customer-avatar-lightbox-actions">
            <button type="button" class="btn-primary" id="cvAvatarUploadBtn" onclick="triggerCustomerAvatarUpload()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload New Image
            </button>
            <button type="button" class="btn-secondary customer-avatar-remove-btn" id="cvAvatarRemoveBtn" onclick="removeCustomerAvatar()">
                <i class="fa-solid fa-trash"></i> Remove Image
            </button>
        </div>
        <input type="file" id="cvAvatarFileInput" accept="image/*" hidden>
    </div>
</div>

<!-- Customer Edit Modal -->
<div id="customerEditModal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-box customer-modal-box">
        <div class="modal-header">
            <div class="customer-profile-title">
                <span id="editCustomerAvatar" class="customer-edit-avatar" role="img" aria-label="Customer photo">
                    <span class="customer-profile-avatar-initial">?</span>
                </span>
                <h3>Edit Profile</h3>
            </div>
            <button type="button" class="close-icon-btn" onclick="closeCustomerEditModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editCustomerId">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="editCustomerName" placeholder="Customer name">
            </div>
            <div class="form-row-custom">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editCustomerEmail" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Mobile</label>
                    <input type="tel" id="editCustomerMobile" placeholder="01XXXXXXXXX" maxlength="11">
                </div>
            </div>
            <div class="form-row-custom">
                <div class="form-group">
                    <label>Phone (Optional)</label>
                    <input type="text" id="editCustomerPhone" placeholder="Alternate phone">
                </div>
                <div class="form-group">
                    <label>Verified Account</label>
                    <select id="editCustomerVerified">
                        <option value="true">Verified</option>
                        <option value="false">Pending</option>
                    </select>
                </div>
            </div>
            <div class="form-row-custom">
                <div class="form-group">
                    <label>District</label>
                    <select id="editCustomerDistrict"></select>
                </div>
                <div class="form-group">
                    <label>Upazila / Thana</label>
                    <select id="editCustomerUpazila" disabled>
                        <option value="">Select upazila / thana</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Full Address / Village / Street</label>
                <textarea id="editCustomerFullAddress" rows="3" placeholder="House, road, village, area details"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeCustomerEditModal()">Cancel</button>
            <button type="button" class="btn-primary" id="saveCustomerBtn" onclick="saveCustomerEdits()">
                <i class="fa-solid fa-floppy-disk"></i> Save Profile
            </button>
        </div>
    </div>
</div>

<!-- Customer Order History Modal -->
<div id="customerOrdersModal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-box customer-modal-box customer-orders-modal">
        <div class="modal-header">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Order History</h3>
            <button type="button" class="close-icon-btn" onclick="closeCustomerOrdersModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <p class="customer-orders-subtitle" id="coCustomerLabel">Loading...</p>
            <div class="table-responsive-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Payment</th>
                        </tr>
                    </thead>
                    <tbody id="customerOrdersTableBody">
                        <tr><td colspan="5" class="loading-cell">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeCustomerOrdersModal()">Close</button>
        </div>
    </div>
</div>
