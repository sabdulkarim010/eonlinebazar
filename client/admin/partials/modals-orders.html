<!-- Manual POS / Phone Order Entry -->
<div id="manualOrderModal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-box manual-order-modal-box">
        <div class="modal-header">
            <div>
                <h3><i class="fa-solid fa-cart-plus"></i> Create Manual Order</h3>
                <p class="edit-modal-subtitle">Staff POS or phone order entry with live variant stock checks</p>
            </div>
            <button type="button" class="close-icon-btn" onclick="closeManualOrderModal()" aria-label="Close manual order modal">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="manualOrderForm" class="manual-order-form" novalidate>
            <div class="modal-body manual-order-body">
                <div class="manual-order-grid">
                    <div class="form-group">
                        <label for="manualCustomerName">Customer Name</label>
                        <input type="text" id="manualCustomerName" required placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <label for="manualCustomerPhone">Phone Number</label>
                        <input type="tel" id="manualCustomerPhone" required placeholder="01XXXXXXXXX">
                    </div>
                    <div class="form-group form-group-full">
                        <label for="manualCustomerAddress">Delivery Address</label>
                        <textarea id="manualCustomerAddress" rows="2" required placeholder="House, road, area, city"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="manualDeliveryArea">Delivery Area</label>
                        <select id="manualDeliveryArea">
                            <option value="inside">Inside Dhaka</option>
                            <option value="outside">Outside Dhaka</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="manualPaymentStatus">Payment Status</label>
                        <select id="manualPaymentStatus">
                            <option value="COD">COD (Cash on Delivery)</option>
                            <option value="Paid">Paid</option>
                        </select>
                    </div>
                </div>

                <div class="manual-order-picker-card">
                    <h4><i class="fa-solid fa-box-open"></i> Add Products</h4>
                    <div class="manual-order-picker-row">
                        <div class="form-group manual-order-search-group">
                            <label for="manualProductSearch">Search Product</label>
                            <input type="search" id="manualProductSearch" placeholder="Type product name…" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="manualProductSelect">Product</label>
                            <select id="manualProductSelect">
                                <option value="">— Select product —</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="manualVariantSelect">Size / Color Variant</label>
                            <select id="manualVariantSelect" disabled>
                                <option value="">— Default (no variant) —</option>
                            </select>
                        </div>
                        <div class="form-group manual-order-qty-group">
                            <label for="manualItemQuantity">Qty</label>
                            <input type="number" id="manualItemQuantity" min="1" value="1">
                        </div>
                        <div class="form-group manual-order-add-group">
                            <label class="manual-order-hidden-label">&nbsp;</label>
                            <button type="button" class="btn-secondary" id="manualAddLineBtn">
                                <i class="fa-solid fa-plus"></i> Add Line
                            </button>
                        </div>
                    </div>
                    <p class="manual-order-stock-hint" id="manualVariantStockHint">Select a product to see price and stock.</p>
                </div>

                <div class="manual-order-lines-wrap">
                    <table class="catalog-table manual-order-lines-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Variant</th>
                                <th>Unit Price</th>
                                <th>Qty</th>
                                <th>Line Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="manualOrderLinesBody">
                            <tr class="manual-order-empty-row">
                                <td colspan="6">No items added yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="manual-order-pricing-grid">
                    <div class="form-group">
                        <label for="manualDiscountAmount">Manual Discount (৳)</label>
                        <input type="number" id="manualDiscountAmount" min="0" step="1" value="0">
                    </div>
                    <div class="form-group">
                        <label for="manualShippingFee">Shipping Fee (৳)</label>
                        <input type="number" id="manualShippingFee" min="0" step="1" value="0">
                    </div>
                    <div class="form-group form-group-full">
                        <label for="manualOrderNote">Internal Note (optional)</label>
                        <input type="text" id="manualOrderNote" placeholder="Phone order ref, counter note, etc.">
                    </div>
                </div>

                <div class="manual-order-totals" id="manualOrderTotalsPreview">
                    Subtotal: ৳0 · Discount: ৳0 · Shipping: ৳0 · <strong>Grand Total: ৳0</strong>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeManualOrderModal()">Cancel</button>
                <button type="submit" class="btn-primary" id="manualOrderSubmitBtn">
                    <i class="fa-solid fa-check"></i> Create Order
                </button>
            </div>
        </form>
    </div>
</div>
