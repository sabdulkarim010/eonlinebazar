<section id="view-hrm-employees" class="admin-section" style="display: none;">
    <div class="section-header-box">
        <div>
            <h3><i class="fa-solid fa-people-carry-box"></i> Employees</h3>
            <p class="section-subtitle">Non-system operational staff — delivery, labour, cleaners etc.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn-secondary" id="employeesRefreshBtn">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button type="button" class="btn-primary" onclick="openAddEmployeeModal()">
                <i class="fa-solid fa-plus"></i> Add Employee
            </button>
        </div>
    </div>

    <div class="metrics-grid hrm-stats-grid" id="employeeStatsRow">
        <div class="metric-card success">
            <div class="icon"><i class="fa-solid fa-user-check"></i></div>
            <div class="data">
                <p>TOTAL ACTIVE</p>
                <h3 id="employeeStatActive">0</h3>
            </div>
        </div>
        <div class="metric-card">
            <div class="icon"><i class="fa-solid fa-building"></i></div>
            <div class="data">
                <p>BY DEPARTMENT</p>
                <h3 id="employeeStatDepartments">—</h3>
            </div>
        </div>
    </div>

    <div class="hrm-filter-bar">
        <div class="form-group">
            <label for="employeeDepartmentFilter">Department</label>
            <select id="employeeDepartmentFilter">
                <option value="">All departments</option>
            </select>
        </div>
        <div class="form-group">
            <label for="employeeStatusFilter">Status</label>
            <select id="employeeStatusFilter">
                <option value="">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="terminated">Terminated</option>
            </select>
        </div>
        <div class="form-group">
            <label for="employeeSearchInput">Search</label>
            <input type="search" id="employeeSearchInput" placeholder="Name, phone, or EMP-ID" autocomplete="off">
        </div>
        <div class="form-group hrm-filter-actions">
            <button type="button" class="btn-primary" onclick="loadEmployees()">
                <i class="fa-solid fa-filter"></i> Apply
            </button>
        </div>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>EMP-ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Department</th>
                    <th>Phone</th>
                    <th>Salary</th>
                    <th>Status</th>
                    <th class="customers-th--actions">Actions</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <tr><td colspan="9" class="loading-container"><div class="spinner"></div><p>Loading employees…</p></td></tr>
            </tbody>
        </table>
    </div>
</section>

<!-- Employee create / edit modal -->
<div id="employeeModal" class="custom-modal-overlay" style="display: none;" onclick="if(event.target===this) closeEmployeeModal()">
    <div class="custom-modal-box" style="max-width:640px;">
        <div class="modal-header">
            <div>
                <h3 id="employeeModalTitle"><i class="fa-solid fa-user-plus"></i> Add Employee</h3>
                <p class="edit-modal-subtitle">Operational staff who do not need admin login</p>
            </div>
            <button type="button" class="close-icon-btn" onclick="closeEmployeeModal()" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="employeeForm" onsubmit="event.preventDefault(); saveEmployee();">
            <input type="hidden" id="employeeEditId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label for="employeeFullName">Full Name *</label>
                    <input type="text" id="employeeFullName" required placeholder="Full legal name">
                </div>
                <div class="form-group">
                    <label for="employeePhone">Phone *</label>
                    <input type="tel" id="employeePhone" required placeholder="01XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label for="employeeRole">Role *</label>
                    <input type="text" id="employeeRole" required placeholder="Delivery Man, Labour, Cleaner…">
                </div>
                <div class="form-group">
                    <label for="employeeDepartment">Department</label>
                    <input type="text" id="employeeDepartment" value="Operations" placeholder="Operations">
                </div>
                <div class="form-group">
                    <label for="employeeBaseSalary">Base Salary</label>
                    <input type="number" id="employeeBaseSalary" min="0" step="1" value="0">
                </div>
                <div class="form-group">
                    <label for="employeeJoiningDate">Joining Date</label>
                    <input type="date" id="employeeJoiningDate">
                </div>
                <div class="form-group">
                    <label for="employeeNationalId">National ID</label>
                    <input type="text" id="employeeNationalId" placeholder="NID number">
                </div>
                <div class="form-group">
                    <label for="employeeAddress">Address</label>
                    <textarea id="employeeAddress" rows="2" placeholder="Home address"></textarea>
                </div>
                <fieldset class="form-group" style="border:1px solid var(--border-color,#e2e8f0);border-radius:8px;padding:12px;">
                    <legend style="padding:0 6px;font-size:0.85rem;">Emergency Contact</legend>
                    <div class="form-group">
                        <label for="employeeEmergencyName">Name</label>
                        <input type="text" id="employeeEmergencyName" placeholder="Contact name">
                    </div>
                    <div class="form-group">
                        <label for="employeeEmergencyPhone">Phone</label>
                        <input type="tel" id="employeeEmergencyPhone" placeholder="01XXXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label for="employeeEmergencyRelation">Relation</label>
                        <input type="text" id="employeeEmergencyRelation" placeholder="Spouse, parent, etc.">
                    </div>
                </fieldset>
                <div class="form-group">
                    <label for="employeeNotes">Notes</label>
                    <textarea id="employeeNotes" rows="2" placeholder="Optional notes"></textarea>
                </div>
                <div class="form-group">
                    <label for="employeeStatus">Status</label>
                    <select id="employeeStatus">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="terminated">Terminated</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeEmployeeModal()">Cancel</button>
                <button type="submit" class="btn-primary" id="employeeSaveBtn">Save Employee</button>
            </div>
        </form>
    </div>
</div>

<!-- Employee details modal -->
<div id="employeeDetailsModal" class="custom-modal-overlay" style="display: none;" onclick="if(event.target===this) closeEmployeeDetailsModal()">
    <div class="custom-modal-box" style="max-width:560px;">
        <div class="modal-header">
            <div>
                <h3><i class="fa-solid fa-id-card"></i> Employee Details</h3>
                <p class="edit-modal-subtitle" id="employeeDetailsSubtitle"></p>
            </div>
            <button type="button" class="close-icon-btn" onclick="closeEmployeeDetailsModal()" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body" id="employeeDetailsBody"></div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeEmployeeDetailsModal()">Close</button>
        </div>
    </div>
</div>
