<section id="view-suppliers" class="admin-section" style="display: none;">
    <div class="section-header-box">
        <div>
            <h3><i class="fa-solid fa-truck-field"></i> Suppliers</h3>
            <p class="section-subtitle">Vendor directory for purchase orders and product sourcing.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn-secondary" id="suppliersRefreshBtn">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
            <button type="button" class="btn-primary" onclick="openAddSupplierModal()">
                <i class="fa-solid fa-plus"></i> Add Supplier
            </button>
        </div>
    </div>
    <div class="table-container">
        <div class="table-header">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="suppliersSearchInput" placeholder="Search suppliers…" autocomplete="off">
            </div>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Contact</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th class="customers-th--actions">Actions</th>
                </tr>
            </thead>
            <tbody id="suppliersTableBody">
                <tr><td colspan="6" class="loading-container"><div class="spinner"></div><p>Loading suppliers…</p></td></tr>
            </tbody>
        </table>
    </div>
</section>

<!-- Supplier create / edit modal -->
<div id="supplierModal" class="custom-modal-overlay" style="display: none;" onclick="if(event.target===this) closeSupplierModal()">
    <div class="custom-modal-box" style="max-width:560px;">
        <div class="modal-header">
            <div>
                <h3 id="supplierModalTitle"><i class="fa-solid fa-truck-field"></i> Add Supplier</h3>
                <p class="edit-modal-subtitle">Vendor contact details for purchase orders</p>
            </div>
            <button type="button" class="close-icon-btn" onclick="closeSupplierModal()" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="supplierForm" onsubmit="event.preventDefault(); saveSupplier();">
            <input type="hidden" id="supplierEditId" value="">
            <div class="modal-body">
                <div class="form-group">
                    <label for="supplierName">Name *</label>
                    <input type="text" id="supplierName" required placeholder="Vendor company name">
                </div>
                <div class="form-group">
                    <label for="supplierContactPerson">Contact Person</label>
                    <input type="text" id="supplierContactPerson" placeholder="Primary contact name">
                </div>
                <div class="form-group">
                    <label for="supplierPhone">Phone</label>
                    <input type="tel" id="supplierPhone" placeholder="01XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label for="supplierEmail">Email</label>
                    <input type="email" id="supplierEmail" placeholder="vendor@example.com">
                </div>
                <div class="form-group">
                    <label for="supplierAddress">Address</label>
                    <textarea id="supplierAddress" rows="2" placeholder="Office / warehouse address"></textarea>
                </div>
                <div class="form-group">
                    <label for="supplierNotes">Notes</label>
                    <textarea id="supplierNotes" rows="2" placeholder="Payment terms, lead times, etc."></textarea>
                </div>
                <div class="form-group">
                    <label for="supplierStatus">Status</label>
                    <select id="supplierStatus">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeSupplierModal()">Cancel</button>
                <button type="submit" class="btn-primary" id="supplierSaveBtn">Save Supplier</button>
            </div>
        </form>
    </div>
</div>
