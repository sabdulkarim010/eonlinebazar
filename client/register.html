<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | EonlineBazar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

<div class="auth-wrapper">
    <button type="button" class="lang-toggle lang-toggle--auth" onclick="i18n.setLanguage(i18n.getCurrentLang() === 'bn' ? 'en' : 'bn')" title="Switch Language">
        <span id="lang-label">EN</span>
    </button>

    <div class="auth-container auth-container--register">
        
        <button class="auth-close-circle" onclick="window.location.href='/index'" title="Go Back">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div id="register-section">
            
            <div class="auth-header-brand">
                <div class="brand-icon-circle">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="auth-title" data-i18n="auth.register">Register</h2>
            </div>
            
            <form id="registerForm" novalidate>

                <div class="auth-name-row">
                    <div class="floating-group">
                        <input type="text" id="regFirstName" required placeholder=" " autocomplete="given-name">
                        <label for="regFirstName">First Name</label>
                        <div id="reg-firstname-error" class="error-text"></div>
                    </div>
                    <div class="floating-group">
                        <input type="text" id="regLastName" required placeholder=" " autocomplete="family-name">
                        <label for="regLastName">Last Name</label>
                        <div id="reg-lastname-error" class="error-text"></div>
                    </div>
                </div>

                <div class="auth-name-row">
                    <div class="floating-group district-search-wrapper">
                        <input
                            type="text"
                            id="reg-district-search-input"
                            class="district-search-input"
                            placeholder=" "
                            autocomplete="off"
                            aria-label="District"
                        >
                        <div id="reg-district-dropdown" class="district-dropdown-list"></div>
                        <input type="hidden" id="reg-district" name="district">
                        <label for="reg-district-search-input" data-i18n="checkout.district">District</label>
                    </div>
                    <div class="floating-group floating-select">
                        <select id="regUpazila" aria-label="Upazila or Thana" disabled>
                            <option value="" selected>Select Upazila / Thana</option>
                        </select>
                        <label for="regUpazila">Upazila / Thana</label>
                    </div>
                </div>

                <div class="floating-group">
                    <input type="text" id="regContact" maxlength="11" required placeholder=" ">
                    <label for="regContact">Mobile Number</label>
                    <div id="reg-contact-error" class="error-text"></div>
                </div>

                <div class="floating-group">
                    <input type="email" id="regEmail" required placeholder=" ">
                    <label for="regEmail" data-i18n="auth.email">Email</label>
                    <div id="reg-email-error" class="error-text"></div>
                </div>

                <div class="floating-group password-group">
                    <input type="password" id="regPassword" required placeholder=" ">
                    <label for="regPassword" data-i18n="auth.password">Password</label>
                    <button type="button" class="toggle-password" id="toggleRegPass" title="Show/Hide Password">
                        <i class="fa-regular fa-eye" id="regEyeIcon"></i>
                    </button>
                    <div id="reg-password-error" class="error-text"></div>
                </div>

                <button type="submit" class="btn-primary" data-i18n="auth.register">Register</button>
            </form>

            <div id="google-auth-section" class="google-auth-section" style="display: none;">
                <p class="auth-divider"><span>Or</span></p>
                <a href="/api/auth/google" class="btn-google-login" id="googleLoginBtn">
                    <img src="/images/google-icon.svg" alt="Google">
                    <span data-i18n="auth.google_login">Login with Google</span>
                </a>
            </div>

            <p class="auth-switch-text">
                <span data-i18n="auth.have_account">Already have an account?</span> <a href="/login" data-i18n="auth.login">Login</a>
            </p>
        </div>

        <div id="success-message" style="display: none; text-align: center; padding: 10px;"></div>

    </div>
</div>

<div id="global-site-footer"></div>
<script src="/js/i18n.js"></script>
<script src="js/session-guard.js"></script>
<script src="js/main.js"></script>
<script src="js/bd-districts.js"></script>
<script src="js/bd-upazilas.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
