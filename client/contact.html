<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us - EonlineBazar</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/contact.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/mini-cart-drawer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="amazon-header">
        <div class="container main-nav">
            <div class="header-row header-row-top">
                <a href="/" class="logo-box" data-store-logo-slot data-logo-variant="navbar" aria-label="EonlineBazar Home"></a>
                <div class="nav-right">
                    <div class="nav-lang">EN</div>
                    <div class="nav-user-account" id="nav-user-link" onclick="window.location.href='/login'" role="link" aria-label="Login">
                        <img id="nav-user-avatar" src="" alt="" class="nav-user-avatar-img">
                        <i class="fa fa-user nav-user-icon" aria-hidden="true"></i>
                        <div class="nav-user-text-wrapper">
                            <span class="nav-line-1" id="nav-user-line1">Login</span>
                            <span class="nav-line-2" id="nav-user-line2">Profile</span>
                        </div>
                    </div>
                    <div class="nav-cart-box" data-mini-cart-trigger role="button" tabindex="0" aria-label="Open shopping bag">
                        <div class="nav-cart-icon-wrapper">
                            <i class="fa fa-shopping-cart"></i>
                            <span id="cartCountBadge" class="cart-count">0</span>
                        </div>
                        <span class="cart-text">Bag</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="contact-page">
        <div class="contact-page-wrap">
            <div class="contact-page-header">
                <h1>Contact Us</h1>
                <p>Questions, feedback, or business inquiries — our team will get back to you shortly.</p>
            </div>

            <div class="contact-grid">
                <div class="contact-form-panel">
                    <h2>Send a Message</h2>
                    <p class="form-sub">Fill in the form and we'll respond to your email as soon as possible.</p>
                    <form id="contactForm" novalidate>
                        <div class="float-field">
                            <input type="text" id="contactName" placeholder=" " required autocomplete="name">
                            <label for="contactName">Your Name</label>
                        </div>
                        <div class="float-field">
                            <input type="email" id="contactEmail" placeholder=" " required autocomplete="email">
                            <label for="contactEmail">Email Address</label>
                        </div>
                        <div class="float-field">
                            <input type="tel" id="contactPhone" placeholder=" " autocomplete="tel">
                            <label for="contactPhone">Phone (optional)</label>
                        </div>
                        <div class="float-field">
                            <input type="text" id="contactSubject" placeholder=" " autocomplete="off">
                            <label for="contactSubject">Subject</label>
                        </div>
                        <div class="float-field">
                            <textarea id="contactMessage" placeholder=" " required></textarea>
                            <label for="contactMessage">Your Message</label>
                        </div>
                        <button type="submit" class="contact-submit-btn" id="contactSubmitBtn">
                            <i class="fa-solid fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </div>

                <div class="contact-info-panel" id="contact-info-panel">
                    <p class="contact-loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading store info...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="global-site-footer"></div>

    <script src="/js/footerRenderer.js"></script>
    <script src="/js/session-guard.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/productThumbnail.js"></script>
    <script src="/js/variantUtils.js"></script>
    <script src="/js/cartDisplayUtils.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/mini-cart-drawer.js"></script>
    <script src="/js/contact.js"></script>
</body>
</html>
