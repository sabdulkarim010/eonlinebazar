<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>EOnlineBazar — Bangladesh's Best Online Shop</title>
    <meta name="description" content="Shop at EOnlineBazar. Best quality products, fast delivery, easy returns.">
    <meta name="keywords" content="EOnlineBazar, online shop, Bangladesh, shopping, ecommerce">
    <meta name="author" content="Abdul Karim Sheikh">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="EOnlineBazar — Bangladesh's Best Online Shop">
    <meta property="og:description" content="Shop at EOnlineBazar. Best quality products, fast delivery, easy returns.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EOnlineBazar">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="/images/og-default.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="EOnlineBazar — Bangladesh's Best Online Shop">
    <meta name="twitter:description" content="Shop at EOnlineBazar. Best quality products, fast delivery, easy returns.">
    <meta name="twitter:image" content="/images/og-default.jpg">

    <link rel="icon" id="dynamic-favicon" href="/images/favicon.png" type="image/png">
    
    <!-- Absolute paths: required so /category/:slug and nested routes never break assets -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/product-thumbnail.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/whatsapp.css">
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/mini-cart-drawer.css">
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="amazon-header">
    <div class="container main-nav">
        <div class="header-row header-row-top">
            <a href="/" class="logo-box" id="home-brand-logo" data-store-logo-slot data-logo-variant="navbar" aria-label="EonlineBazar Home"></a>

            <div class="nav-right">
                <button type="button" class="lang-toggle" onclick="i18n.setLanguage(i18n.getCurrentLang() === 'bn' ? 'en' : 'bn')" title="Switch Language">
                    <span id="lang-label">EN</span>
                </button>

                <div class="nav-user-account" id="nav-user-link" onclick="window.location.href='/login'">
                    <img id="nav-user-avatar" src="" alt="User" class="nav-user-avatar-img">

                    <div class="nav-user-text-wrapper">
                        <span class="nav-line-1" id="nav-user-line1" data-i18n="nav.login">Login</span>
                        <span class="nav-line-2" id="nav-user-line2" data-i18n="nav.profile">Profile</span>
                    </div>
                </div>

                <div class="nav-cart-box" data-mini-cart-trigger role="button" tabindex="0" aria-label="Open shopping bag">
                    <div class="nav-cart-icon-wrapper">
                        <i class="fa fa-shopping-cart"></i>
                        <span id="cartCountBadge" class="cart-count">0</span>
                    </div>
                    <span class="cart-text" data-i18n="nav.cart">Cart</span>
                </div>
            </div>
        </div>

        <div class="header-row header-row-search">
            <div class="search-box-container">
                <select id="searchCategorySelect" class="search-category" aria-label="Search in category" data-role="search-scope">
                    <option value="all">All Categories</option>
                </select>
                <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="search.placeholder" placeholder="Search products...">
                <button type="button" class="search-submit-btn" id="headerSearchBtn" title="Search" aria-label="Search">
                    <i class="fa fa-search"></i>
                </button>
            </div>
        </div>
    </div>
</header>

    <nav id="subNavbar" class="sub-navbar">
        <div class="container sub-flex">
            <ul class="nav-links" id="category-navbar">
                <li>
                    <a href="/" class="active" data-i18n="nav.home">Home</a>
                </li>
                <!-- ☰ All + dynamic NavbarLink promo links; categories live in the drawer only -->
                <li class="nav-categories-slot nav-links-slot">
                    <div id="categoryButtonContainer" class="category-tabs-row menu-categories" aria-label="Quick navigation links"></div>
                </li>
            </ul>
        </div>
    </nav>

    <div id="heroBannerSlider"></div>

    <section class="homepage-categories" id="homepageCats">
      <!-- Rendered by JS -->
    </section>

    <main class="container products-container">
        <section id="flashSaleBanner" class="flash-sale-banner" style="display:none;" aria-live="polite">
            <div class="flash-sale-banner__content">
                <div class="flash-sale-banner__copy">
                    <span class="flash-sale-banner__eyebrow">Limited Time Offer</span>
                    <h2 id="flashSaleTitle" data-i18n="home.flash_sale">Flash Sale</h2>
                    <p id="flashSaleSubtitle">Grab exclusive discounts before the timer hits zero.</p>
                </div>
                <div class="flash-sale-banner__timer-wrap">
                    <span class="flash-sale-banner__timer-label" data-i18n="home.ends_in">Ends in</span>
                    <div class="flash-sale-countdown" id="flashSaleCountdown">
                        <div class="flash-sale-countdown__unit"><strong id="flashHours">00</strong><small>Hours</small></div>
                        <span class="flash-sale-countdown__sep">:</span>
                        <div class="flash-sale-countdown__unit"><strong id="flashMinutes">00</strong><small>Minutes</small></div>
                        <span class="flash-sale-countdown__sep">:</span>
                        <div class="flash-sale-countdown__unit"><strong id="flashSeconds">00</strong><small>Seconds</small></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="catalog-header-row">
            <h2 class="section-title" data-i18n="home.featured">Featured Products</h2>
        </div>
        <div id="productGrid" class="product-layout-grid"></div>
        <div id="homeLoadMoreWrap" class="catalog-load-more-wrap" hidden></div>
        <div id="homePaginationContainer" class="catalog-pagination search-pagination"></div>
    </main>

    <!-- WhatsApp Button S-->
        <div class="whatsapp-floating-container">
        <div class="whatsapp-tooltip" id="waTooltip">Need help? Chat with us!</div>
        <a href="#" id="waFloatBtn" data-whatsapp-chat target="_blank" rel="noopener noreferrer" class="whatsapp-float-btn">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
    </div>
    <!-- WhatsApp Button E-->

        <!-- footer calling -->
        <div id="global-site-footer"></div>

    <script src="/js/i18n.js"></script>
    <script src="/js/urlUtils.js"></script>
    <script src="/js/session-guard.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/wishlist.js"></script>
    <script src="/js/productThumbnail.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/sidebarDrawer.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/banner-slider.js"></script>
    <script src="/js/variantUtils.js"></script>
    <script src="/js/cartDisplayUtils.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/mini-cart-drawer.js"></script>
    <script src="/js/whatsapp.js"></script>
</body>
</html>
