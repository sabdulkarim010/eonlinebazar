<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | EOnlineBazar</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.08) 0%, transparent 70%);
    bottom: -50px;
    left: -50px;
    pointer-events: none;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .admin-login-card {
    width: 100%;
    max-width: 440px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 44px 40px;
    position: relative;
    z-index: 1;
    box-shadow:
      0 24px 60px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.05) inset;
  }

  .admin-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.25);
    color: #fca5a5;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 24px;
  }

  .admin-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #ef4444;
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .admin-logo-area {
    margin-bottom: 28px;
  }

  .admin-logo-text {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: white;
    line-height: 1;
    margin-bottom: 4px;
  }

  .admin-logo-text span {
    color: #f97316;
  }

  .admin-subtitle {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
  }

  .admin-heading {
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    margin-bottom: 6px;
  }

  .admin-desc {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.45);
    margin-bottom: 28px;
  }

  .admin-divider-line {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin-bottom: 28px;
  }

  .admin-error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #fca5a5;
  }
  .admin-error.show { display: flex; }

  .admin-field {
    margin-bottom: 16px;
  }

  .admin-field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 7px;
  }

  .admin-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .admin-input-icon {
    position: absolute;
    left: 14px;
    color: rgba(255,255,255,0.25);
    font-size: 0.95rem;
    pointer-events: none;
    z-index: 1;
  }

  .admin-input {
    width: 100%;
    padding: 13px 16px 13px 42px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: white;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.2s;
    box-sizing: border-box;
  }

  .admin-input::placeholder {
    color: rgba(255,255,255,0.2);
  }

  .admin-input:focus {
    border-color: rgba(99,102,241,0.6);
    background: rgba(99,102,241,0.08);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
  }

  .admin-input:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 30px #1a1a2e inset !important;
    -webkit-text-fill-color: white !important;
  }

  .admin-input-pwd {
    padding-right: 48px;
  }

  .admin-eye-btn {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,0.2);
    padding: 6px;
    display: flex;
    align-items: center;
    border-radius: 6px;
    transition: color 0.2s;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }

  .admin-eye-btn.show {
    opacity: 1;
    pointer-events: auto;
    color: rgba(255,255,255,0.4);
  }

  .admin-eye-btn:hover { color: white; }

  .admin-submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }

  .admin-submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(99,102,241,0.45);
    background: linear-gradient(135deg, #818cf8, #6366f1);
  }

  .admin-submit-btn:active { transform: translateY(0); }

  .admin-submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .admin-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .admin-footer-info {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .admin-footer-info-text {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .admin-back-link {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    transition: color 0.15s;
  }
  .admin-back-link:hover { color: rgba(255,255,255,0.7); }

  .admin-2fa-section {
    display: block;
    margin-top: 16px;
  }

  .admin-otp-input {
    text-align: center;
    font-size: 1.4rem;
    letter-spacing: 10px;
    font-weight: 700;
    padding: 13px 16px !important;
  }

  .admin-2fa-info {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    text-align: center;
    margin-top: 8px;
  }

  /* Toast notifications (success / info) */
  .toast-container {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 9999;
    width: 90%;
    max-width: 400px;
    pointer-events: none;
  }

  .toast {
    background: rgba(26, 26, 46, 0.95);
    backdrop-filter: blur(12px);
    padding: 14px 18px;
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    border-left: 3px solid #6366f1;
    animation: toastIn 0.35s ease forwards;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: auto;
  }

  .toast.success { border-left-color: #10b981; }
  .toast.error { border-left-color: #ef4444; }

  .toast-icon {
    font-size: 1rem;
    flex-shrink: 0;
  }

  .toast.success .toast-icon { color: #34d399; }
  .toast.error .toast-icon { color: #fca5a5; }

  .toast-message {
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    line-height: 1.4;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .admin-login-card { padding: 32px 24px; }
    .admin-logo-text { font-size: 1.3rem; }
  }
  </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>
<div class="bg-grid"></div>

<div class="admin-login-card">

  <div class="admin-badge">Restricted Access</div>

  <div class="admin-logo-area">
    <div class="admin-logo-text">
      EONLINE<span>BAZAR</span>
    </div>
    <div class="admin-subtitle">Admin Control Panel</div>
  </div>

  <div class="admin-heading">Secure Admin Login</div>
  <div class="admin-desc">Only authorized administrators can access this panel.</div>

  <div class="admin-divider-line"></div>

  <div class="admin-error" id="adminLoginError">
    <span>🚫</span>
    <span id="adminLoginErrorText">Invalid credentials</span>
  </div>

  <form id="adminLoginForm" onsubmit="return false">

    <div class="admin-field">
      <label for="adminUsername">Username</label>
      <div class="admin-input-wrap">
        <span class="admin-input-icon">👤</span>
        <input
          type="text"
          id="adminUsername"
          class="admin-input"
          placeholder="Enter admin username"
          autocomplete="username"
          required
        >
      </div>
    </div>

    <div class="admin-field">
      <label for="adminPassword">Password</label>
      <div class="admin-input-wrap">
        <span class="admin-input-icon">🔐</span>
        <input
          type="password"
          id="adminPassword"
          class="admin-input admin-input-pwd"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          oninput="adminToggleEye(this)"
          onkeydown="if(event.key==='Enter') handleAdminLogin()"
        >
        <button
          type="button"
          class="admin-eye-btn"
          id="adminPasswordEye"
          onclick="adminTogglePwd('adminPassword', this)"
          title="Show password"
          aria-label="Show password"
        >
          <svg width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="admin-2fa-section" id="admin2faSection">
      <div class="admin-field">
        <label for="admin2faCode">Two-Factor Code</label>
        <div class="admin-input-wrap">
          <span class="admin-input-icon">🛡️</span>
          <input
            type="text"
            id="admin2faCode"
            class="admin-input admin-otp-input"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)"
            onkeydown="if(event.key==='Enter') handleAdminLogin()"
          >
        </div>
        <div class="admin-2fa-info">
          Optional if 2FA is on — enter your authenticator code to skip the extra page
        </div>
      </div>
    </div>

    <button
      type="button"
      class="admin-submit-btn"
      id="adminLoginBtn"
      onclick="handleAdminLogin()"
    >
      <div class="admin-spinner" id="adminSpinner"></div>
      <span id="adminBtnText">🔓 Access Admin Panel</span>
    </button>

  </form>

  <div class="admin-footer-info">
    <span class="admin-footer-info-text">
      🔒 256-bit SSL encrypted
    </span>
    <a href="/" class="admin-back-link">← Back to Store</a>
  </div>

</div>

<script>
function adminToggleEye(input) {
  const btn = document.getElementById('adminPasswordEye');
  if (btn) {
    btn.classList.toggle('show', input.value.length > 0);
  }
}

function adminTogglePwd(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;

  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';

  btn.innerHTML = isHidden
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
         <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
           a18.45 18.45 0 0 1 5.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
           a18.5 18.5 0 0 1-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>
       </svg>`
    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
         <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
         <circle cx="12" cy="12" r="3"/>
       </svg>`;

  btn.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
  btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
}

function showAdminError(msg) {
  const el = document.getElementById('adminLoginError');
  const txt = document.getElementById('adminLoginErrorText');
  if (el && txt) {
    txt.textContent = msg;
    el.classList.add('show');
  }
}

function hideAdminError() {
  const el = document.getElementById('adminLoginError');
  if (el) el.classList.remove('show');
}

function setAdminLoading(loading) {
  const btn = document.getElementById('adminLoginBtn');
  const spinner = document.getElementById('adminSpinner');
  const text = document.getElementById('adminBtnText');
  if (btn) btn.disabled = loading;
  if (spinner) spinner.style.display = loading ? 'block' : 'none';
  if (text) text.textContent = loading ? 'Verifying...' : '🔓 Access Admin Panel';
}
</script>

<script type="module" src="/js/admin-login.js"></script>
</body>
</html>
