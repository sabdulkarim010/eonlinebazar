<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - EonlineBazar</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout-step-header.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/product-thumbnail.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="css/toast.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <header class="checkout-step-header">
        <div class="checkout-step-header__container">
            <div class="checkout-step-header__left">
                <a href="/" class="checkout-step-header__back-link">
                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                    <span class="checkout-step-header__back-desktop">Continue Shopping</span>
                    <span class="checkout-step-header__back-mobile">Back</span>
                </a>
            </div>
            <div class="checkout-step-header__center">
                <button type="button" class="lang-toggle lang-toggle--standalone" style="position:static;margin-right:12px;" onclick="i18n.setLanguage(i18n.getCurrentLang() === 'bn' ? 'en' : 'bn')" title="Switch Language">
                    <span id="lang-label">EN</span>
                </button>
                <span class="checkout-step-header__secure-badge">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <span class="checkout-step-header__secure-desktop">SECURE CHECKOUT</span>
                    <span class="checkout-step-header__secure-mobile">SECURE</span>
                </span>
                <span class="checkout-step-header__step">Step 1 of 3</span>
            </div>
            <a href="/" class="checkout-step-header__brand" data-store-logo-slot data-logo-variant="checkout-header" aria-label="EonlineBazar Home"></a>
        </div>
    </header>

    <div class="shopping-cart-main-container">
        
        <div class="cart-title-area">
            <h2>
                <i class="fa-solid fa-cart-shopping"></i> <span data-i18n="cart.title">আপনার কার্ট</span>
            </h2>
        </div>

        <div id="cartItemsContainer">
            </div>

        <div class="cart-totals-bottom-section cart-summary-compact" id="cartSummarySection">
            <p class="subtotal-row">Selected Items: <strong id="cartSelectedItemsCount">0 Items</strong></p>
            <p class="subtotal-row cart-summary-subtotal"><span data-i18n="cart.total">মোট</span>: <strong id="cartSubtotalAmount">৳0</strong></p>

            <div class="free-shipping-progress" id="cartFreeShippingProgress" style="display:none;">
                <p class="free-shipping-progress-text" id="cartFreeShippingProgressText"></p>
                <div class="free-shipping-progress-track">
                    <span class="free-shipping-progress-bar" id="cartFreeShippingProgressBar"></span>
                </div>
            </div>

            <button type="button" id="proceedToCheckoutBtn" class="checkout-redirect-btn">
                <span data-i18n="cart.checkout">চেকআউট করুন</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </div>

        <!-- footer calling -->
        <div id="global-site-footer"></div>
    <script src="/js/i18n.js"></script>
    <script src="js/session-guard.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/main.js"></script>
    <script src="js/productThumbnail.js"></script>
    <script src="js/stockAlert.js"></script>
    <script src="js/shipping-estimator.js"></script>
    <script src="js/variantUtils.js"></script>
    <script src="js/cartDisplayUtils.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
