<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Account | EonlineBazar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

<div class="auth-wrapper">
    <button type="button" class="lang-toggle lang-toggle--auth" onclick="i18n.setLanguage(i18n.getCurrentLang() === 'bn' ? 'en' : 'bn')" title="Switch Language">
        <span id="lang-label">EN</span>
    </button>

    <div class="auth-container">
        
        <button class="auth-close-circle" onclick="window.location.href='/index'" title="Go Back">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div id="login-section">
            
            <div class="auth-header-brand">
                <div class="brand-icon-circle">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="auth-title" data-i18n="auth.login">লগইন</h2>
            </div>
            
            <form id="loginForm" novalidate>
                
                <div class="floating-group">
                    <input type="text" id="loginInput" name="loginInput" required placeholder=" " autocomplete="username">
                    <label for="loginInput">Email Address or Mobile Number</label>
                    <div id="login-input-error" class="error-text"></div>
                </div>
                
                <div class="floating-group password-group password-no-icons">
                    <input type="password" id="loginPass" required placeholder=" ">
                    <label for="loginPass" data-i18n="auth.password">পাসওয়ার্ড</label>
                    <button type="button" class="toggle-password" id="toggleLoginPass" title="Show/Hide Password">
                        <i class="fa-regular fa-eye" id="loginEyeIcon"></i>
                    </button>
                    <div id="login-pass-error" class="error-text"></div>
                </div>

                <div class="auth-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px;">
                    <label class="remember-me" style="display: flex; align-items: center; gap: 5px; cursor: pointer; color: #64748b;">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" id="forgotPasswordLink" class="forgot-password-link hidden-forgot-link" style="display: none; color: #e74c3c; font-weight: 600; text-decoration: none;" data-i18n="auth.forgot_password">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <button type="submit" class="btn-primary" data-i18n="auth.login">লগইন</button>
            </form>

            <div id="google-auth-section" class="google-auth-section" style="display: none;">
                <p class="auth-divider"><span>অথবা</span></p>
                <a href="/api/auth/google" class="btn-google-login" id="googleLoginBtn">
                    <img src="/images/google-icon.svg" alt="Google">
                    <span data-i18n="auth.google_login">Google দিয়ে লগইন</span>
                </a>
            </div>

            <p class="auth-switch-text">
                <span data-i18n="auth.no_account">অ্যাকাউন্ট নেই?</span> <a href="/register" data-i18n="auth.register">নিবন্ধন করুন</a>
            </p>
        </div>

        <div id="success-message" style="display: none; text-align: center; padding: 10px;"></div>

    </div>
</div>

<div id="global-site-footer"></div>
<script src="/js/i18n.js"></script>
<script src="js/session-guard.js"></script>
<script src="js/cart-merge.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
