<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>পণ্য খুঁজুন | EOnlineBazar</title>
    <meta name="description" id="meta-description" content="EOnlineBazar-এ পণ্য খুঁজুন — সেরা মান, দ্রুত ডেলিভারি।">
    <meta name="robots" content="index, follow">
    <meta id="og-title" property="og:title" content="পণ্য খুঁজুন | EOnlineBazar">
    <meta id="og-description" property="og:description" content="EOnlineBazar-এ পণ্য খুঁজুন — সেরা মান, দ্রুত ডেলিভারি।">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EOnlineBazar">
    <meta property="og:locale" content="bn_BD">
    <meta id="og-image" property="og:image" content="/images/og-default.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="images/favicon.png" type="image/png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/product-thumbnail.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/whatsapp.css">
    <link rel="stylesheet" href="css/mini-cart-drawer.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================
           সার্চ পেজ-নির্দিষ্ট লেআউট (গ্লোবাল CSS অক্ষত রেখে)
           ========================================================== */
        .search-results-wrap { padding-top: 20px; padding-bottom: 60px; }

        .search-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid #eee;
        }
        .search-heading { font-size: 20px; font-weight: 700; color: #232f3e; margin: 0; }
        .search-heading .search-term { color: #e47911; }
        .search-count { font-size: 13px; color: #777; font-weight: 500; }

        .search-sort-box { display: flex; align-items: center; gap: 8px; }
        .search-sort-box label { font-size: 13px; color: #555; font-weight: 600; }
        .search-sort-select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
            outline: none;
        }
        .search-sort-select:focus { border-color: #e47911; }

        /* লোডিং স্কেলিটন / স্টেট */
        .search-state {
            text-align: center;
            padding: 70px 20px;
            width: 100%;
        }
        .search-state .state-icon { font-size: 56px; margin-bottom: 16px; color: #d0d0d0; }
        .search-state h3 { font-size: 20px; color: #333; margin: 0 0 8px; }
        .search-state p { color: #888; margin: 0 0 22px; font-size: 15px; }
        .search-back-btn {
            display: inline-block;
            background: #e47911;
            color: #fff;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background .2s ease;
        }
        .search-back-btn:hover { background: #cf6a08; }

        /* পেজিনেশন */
        .search-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 36px;
            flex-wrap: wrap;
        }
        .page-btn {
            min-width: 40px;
            padding: 9px 14px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            color: #333;
            transition: all .15s ease;
        }
        .page-btn:hover:not(:disabled) { border-color: #e47911; color: #e47911; }
        .page-btn.active { background: #232f3e; color: #fff; border-color: #232f3e; }
        .page-btn:disabled { opacity: .45; cursor: not-allowed; }

        /* ==========================================================
           Advanced filter sidebar layout
           ========================================================== */
        .search-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .search-filters {
            flex: 0 0 260px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            padding: 18px 16px;
            position: sticky;
            top: 16px;
        }

        .search-results-main { flex: 1; min-width: 0; }

        .filter-section { margin-bottom: 20px; }
        .filter-section:last-child { margin-bottom: 0; }
        .filter-section-title {
            font-size: 14px;
            font-weight: 700;
            color: #232f3e;
            margin: 0 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
        }

        .price-inputs { display: flex; gap: 8px; align-items: center; }
        .price-inputs input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .price-inputs input:focus { border-color: #e47911; }
        .price-range-display {
            font-size: 12px;
            color: #777;
            margin-top: 8px;
        }

        .brand-list { list-style: none; margin: 0; padding: 0; }
        .brand-list li { margin-bottom: 6px; }
        .brand-list label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
        }
        .brand-list input[type="checkbox"] { accent-color: #e47911; }
        .brand-expand-btn {
            background: none;
            border: none;
            color: #e47911;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
            margin-top: 4px;
        }

        .rating-options { display: flex; flex-direction: column; gap: 6px; }
        .rating-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
        }
        .rating-options input[type="radio"] { accent-color: #e47911; }

        .stock-filter label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
        }

        .filter-clear-btn {
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: background .15s;
        }
        .filter-clear-btn:hover { background: #eee; }

        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff3e6;
            border: 1px solid #f0c78a;
            color: #c45500;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .filter-tag-remove {
            background: none;
            border: none;
            color: #c45500;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .mobile-filter-toggle {
            display: none;
            width: 100%;
            padding: 12px 16px;
            background: #232f3e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        @media (max-width: 767px) {
            .search-layout { flex-direction: column; }
            .search-filters {
                display: none;
                flex: none;
                width: 100%;
                position: static;
            }
            .search-filters.is-open { display: block; }
            .mobile-filter-toggle { display: block; }
        }
    </style>
</head>
<body>

<header class="amazon-header">
    <div class="container main-nav">
        <div class="header-row header-row-top">
            <a href="/" class="logo-box" data-store-logo-slot data-logo-variant="navbar" aria-label="EonlineBazar Home"></a>

            <div class="nav-right">
                <div class="nav-user-account" id="nav-user-link" onclick="window.location.href='/login'">
                    <img id="nav-user-avatar" src="" alt="User" class="nav-user-avatar-img">
                    <div class="nav-user-text-wrapper">
                        <span class="nav-line-1" id="nav-user-line1">Sign in</span>
                        <span class="nav-line-2" id="nav-user-line2">Account</span>
                    </div>
                </div>

                <div class="nav-cart-box" data-mini-cart-trigger role="button" tabindex="0" aria-label="Open shopping bag">
                    <div class="nav-cart-icon-wrapper">
                        <i class="fa fa-shopping-cart"></i>
                        <span id="cartCountBadge" class="cart-count">0</span>
                    </div>
                    <span class="cart-text">Bag</span>
                </div>
            </div>
        </div>

        <div class="header-row header-row-search">
            <div class="search-box-container">
                <select id="categorySelect" class="search-category">
                    <option value="all">All Categories</option>
                </select>
                <input type="text" id="searchInput" class="search-input" placeholder="Search products here...">
                <button class="search-submit-btn" id="headerSearchBtn" title="Search">
                    <i class="fa fa-search"></i>
                </button>
            </div>
        </div>
    </div>
</header>

<main class="container search-results-wrap">
    <button type="button" class="mobile-filter-toggle" id="mobileFilterToggle" aria-expanded="false">
        ফিল্টার দেখুন 🔽
    </button>

    <div class="search-layout">
        <aside class="search-filters" id="searchFilters">
            <div class="filter-section">
                <h3 class="filter-section-title">দাম</h3>
                <div class="price-inputs">
                    <input type="number" id="minPriceInput" min="0" placeholder="০" aria-label="সর্বনিম্ন দাম">
                    <span>—</span>
                    <input type="number" id="maxPriceInput" min="0" placeholder="সর্বোচ্চ" aria-label="সর্বোচ্চ দাম">
                </div>
                <div class="price-range-display" id="priceRangeDisplay">৳০ — ৳৫০০০</div>
            </div>

            <div class="filter-section">
                <h3 class="filter-section-title">ব্র্যান্ড</h3>
                <ul class="brand-list" id="brandFilterList"></ul>
                <button type="button" class="brand-expand-btn" id="brandExpandBtn" style="display:none;">আরো দেখুন</button>
            </div>

            <div class="filter-section">
                <h3 class="filter-section-title">রেটিং</h3>
                <div class="rating-options" id="ratingFilter">
                    <label><input type="radio" name="ratingFilter" value=""> সব</label>
                    <label><input type="radio" name="ratingFilter" value="5"> ⭐⭐⭐⭐⭐ (5)</label>
                    <label><input type="radio" name="ratingFilter" value="4"> ⭐⭐⭐⭐+ (4+)</label>
                    <label><input type="radio" name="ratingFilter" value="3"> ⭐⭐⭐+ (3+)</label>
                </div>
            </div>

            <div class="filter-section stock-filter">
                <label>
                    <input type="checkbox" id="inStockCheckbox">
                    শুধু স্টকে আছে এমন পণ্য
                </label>
            </div>

            <button type="button" class="filter-clear-btn" id="clearFiltersBtn">ফিল্টার পরিষ্কার করুন</button>
        </aside>

        <div class="search-results-main">
            <div class="search-toolbar">
                <div>
                    <h1 class="search-heading" id="searchHeading">Search Results</h1>
                    <span class="search-count" id="searchCount"></span>
                </div>
                <div class="search-sort-box" id="sortBox">
                    <label for="sortSelect">সাজান</label>
                    <select id="sortSelect" class="search-sort-select">
                        <option value="newest">নতুন আগে</option>
                        <option value="oldest">পুরনো আগে</option>
                        <option value="price_asc">দাম: কম থেকে বেশি</option>
                        <option value="price_desc">দাম: বেশি থেকে কম</option>
                        <option value="rating_desc">সেরা রেটিং</option>
                        <option value="popular">সবচেয়ে জনপ্রিয়</option>
                    </select>
                </div>
            </div>

            <div class="active-filters" id="activeFilters"></div>

            <div id="productGrid" class="product-layout-grid"></div>

            <div id="paginationContainer" class="search-pagination"></div>
        </div>
    </div>
</main>

<!-- WhatsApp Button -->
<div class="whatsapp-floating-container">
    <div class="whatsapp-tooltip" id="waTooltip">Need help? Chat with us!</div>
    <a href="#" id="waFloatBtn" data-whatsapp-chat target="_blank" rel="noopener noreferrer" class="whatsapp-float-btn">
        <i class="fa-brands fa-whatsapp"></i>
    </a>
</div>

<!-- footer calling -->
<div id="global-site-footer"></div>

<script src="js/session-guard.js"></script>
<script src="js/toast.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/productThumbnail.js"></script>
<script src="js/variantUtils.js"></script>
<script src="js/cartDisplayUtils.js"></script>
<script src="js/cart.js"></script>
<script src="js/mini-cart-drawer.js"></script>
<script src="js/search.js"></script>
<script src="js/whatsapp.js"></script>

</body>
</html>
