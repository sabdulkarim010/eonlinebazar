version: '3.8'

# Run from ecommerce-chat/ with:
#   docker compose -f ../devops/docker-compose.yml up -d --build
# Or from devops/ (build context points at ecommerce-chat).

services:
  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ecommerce-chat
    ports:
      - "27017:27017"

  backend:
    build:
      context: ../ecommerce-chat
      dockerfile: ../devops/Dockerfile
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    env_file:
      - ../ecommerce-chat/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/ecommerce_chat
      PORT: 5000
    volumes:
      - ../ecommerce-chat/logs:/app/logs

volumes:
  mongo_data:
