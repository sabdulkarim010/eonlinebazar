# HTTP → HTTPS redirect
server {
  listen 80;
  server_name yourchatdomain.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name yourchatdomain.com;

  # SSL (Certbot will fill / renew these)
  ssl_certificate     /etc/letsencrypt/live/yourchatdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourchatdomain.com/privkey.pem;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 10M;

  # API proxy
  location /api/ {
    proxy_pass http://localhost:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health check
  location /health {
    proxy_pass http://localhost:5000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Socket.io (WebSocket upgrade + long timeouts)
  location /socket.io/ {
    proxy_pass http://localhost:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Chat widget static assets (optional — if served from Node public/)
  location /css/ {
    proxy_pass http://localhost:5000;
    expires 7d;
    add_header Cache-Control "public, no-transform";
  }

  location /js/ {
    proxy_pass http://localhost:5000;
    expires 7d;
    add_header Cache-Control "public, no-transform";
  }

  # Admin dashboard (React SPA)
  location / {
    root /var/www/admin-dashboard/dist;
    try_files $uri $uri/ /index.html;
    expires 1d;
    add_header Cache-Control "public, no-transform";
  }
}
