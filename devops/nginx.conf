server {
    listen 80;
    server_name eonlinebazar.com www.eonlinebazar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name eonlinebazar.com www.eonlinebazar.com;

    ssl_certificate /etc/letsencrypt/live/eonlinebazar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eonlinebazar.com/privkey.pem;

    # Chat Admin Dashboard (React SPA)
    location /chat-admin/ {
        alias /var/www/html/chat-admin/;
        try_files $uri $uri/ /chat-admin/index.html;
    }

    # Chat API (admin paths: /chat-api/admin/... → /api/admin/...)
    location /chat-api/ {
        rewrite ^/chat-api/(.*) /api/$1 break;
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat widget static assets (avoid conflict with store /css /js)
    location = /css/chat-widget.css {
        proxy_pass http://localhost:5001/css/chat-widget.css;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /js/chat-widget.js {
        proxy_pass http://localhost:5001/js/chat-widget.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Socket.io for chat (custom path — does not conflict with store /socket.io/)
    location /chat-socket/socket.io/ {
        proxy_pass http://localhost:5001/chat-socket/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main store
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
}
