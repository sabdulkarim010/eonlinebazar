name: Deploy ecommerce-chat

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/ecommerce-chat || cd /var/www/ecommerce-chat
            git pull origin main
            npm ci --only=production

            # Admin dashboard build (if sibling or nested)
            if [ -d "../admin-dashboard" ]; then
              cd ../admin-dashboard
              npm ci
              npm run build
              sudo mkdir -p /var/www/admin-dashboard
              sudo rsync -a --delete dist/ /var/www/admin-dashboard/dist/
              cd ../ecommerce-chat
            elif [ -d "admin-dashboard" ]; then
              cd admin-dashboard
              npm ci
              npm run build
              sudo mkdir -p /var/www/admin-dashboard
              sudo rsync -a --delete dist/ /var/www/admin-dashboard/dist/
              cd ..
            fi

            mkdir -p logs
            pm2 reload ecommerce-chat --update-env || pm2 start ecosystem.config.js --env production
            pm2 save
