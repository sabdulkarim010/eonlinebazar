# ecommerce-chat runs on PORT 5001
# Main store runs on PORT 5000
# Confirm your .env PORT value matches these upstreams
#
# Production Nginx config for ecommerce-chat
# Copy to: /etc/nginx/sites-available/ecommerce-chat
# Enable:  sudo ln -s /etc/nginx/sites-available/ecommerce-chat /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  server_name yourchatdomain.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name yourchatdomain.com;

  # SSL (Certbot will fill these)
  ssl_certificate /etc/letsencrypt/live/yourchatdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourchatdomain.com/privkey.pem;

  # API + Socket proxy
  location /api/ {
    proxy_pass http://localhost:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://localhost:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Health check (backend)
  location /health {
    proxy_pass http://localhost:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Chat widget static files from Node public/ (css/js)
  location /css/ {
    proxy_pass http://localhost:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 7d;
  }

  location /js/ {
    proxy_pass http://localhost:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 7d;
  }

  # Serve admin dashboard static files
  location / {
    root /var/www/admin-dashboard/dist;
    try_files $uri $uri/ /index.html;
    expires 1d;
    add_header Cache-Control "public, no-transform";
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy "strict-origin-when-cross-origin";

  client_max_body_size 10M;
}
